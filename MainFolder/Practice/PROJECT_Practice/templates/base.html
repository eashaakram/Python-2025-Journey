<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}DSA Tracker{% endblock %}</title>

    <style>
        /* ======================
           ROOT VARIABLES (FIX)
        ======================= */
        :root {
            --accent-teal: #00bfa6;
            --accent-purple: #7c4dff;
            --text-secondary: #6c757d;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #e2e8f0;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .btn {
            padding: 8px 12px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
        }

        .btn-secondary {
            background: #334155;
            color: white;
        }

        .btn-outline {
            border: 1px solid var(--accent-teal);
            background: transparent;
            color: var(--accent-teal);
        }

        .btn-primary {
            background: var(--accent-teal);
            color: #000;
        }

        /* layout container */
        .container {
            padding: 20px;
        }
    </style>
</head>

<body>

    <div class="container">
        {% block content %}
        {% endblock %}
    </div>

</body>
</html>
