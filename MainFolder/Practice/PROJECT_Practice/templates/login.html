{% extends "base.html" %}
{% block title %}Log In{% endblock %}

{% block content %}
<section class="auth-page" aria-labelledby="login-heading">
  <div class="auth-card">

    <!-- Card Header -->
    <div class="auth-card-header">
      <div class="card-logo" aria-hidden="true">
        <!-- Lock icon -->
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
      </div>
      <h1 id="login-heading">Welcome back</h1>
      <p>Sign in to continue your DSA journey.</p>
    </div>

    <!-- Server-side error -->
    {% if error %}
      <div class="alert alert-error" role="alert">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/>
          <line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        {{ error }}
      </div>
    {% endif %}

    <!-- Login Form -->
    <form id="loginForm" method="POST" action="{{ url_for('login') }}" novalidate>

      <!-- Email -->
      <div class="form-group">
        <label for="email" class="form-label">Email address</label>
        <input
          type="email"
          id="email"
          name="email"
          class="form-control"
          placeholder="you@example.com"
          autocomplete="email"
          required
          aria-describedby="email-error"
        >
        <!-- JS will inject error here -->
      </div>

      <!-- Password -->
      <div class="form-group">
        <label for="password" class="form-label">Password</label>
        <div class="input-wrapper">
          <input
            type="password"
            id="password"
            name="password"
            class="form-control"
            placeholder="Your password"
            autocomplete="current-password"
            required
            minlength="6"
            aria-describedby="password-error"
          >
          <!-- Eye toggle -->
          <button
            type="button"
            class="toggle-password"
            data-target="password"
            aria-label="Show password"
            tabindex="-1"
          ></button>
        </div>
        <!-- JS will inject error here -->
      </div>

      <!-- Submit -->
      <button type="submit" class="btn btn-primary btn-lg btn-full mt-2">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
          <polyline points="10 17 15 12 10 7"/>
          <line x1="15" y1="12" x2="3" y2="12"/>
        </svg>
        Sign in
      </button>

    </form>

    <div class="auth-divider">or</div>

    <div class="auth-footer-text">
      Don't have an account?
      <a href="{{ url_for('signup') }}" style="font-weight:600;">Create one free</a>
    </div>

  </div>
</section>
{% endblock %}
