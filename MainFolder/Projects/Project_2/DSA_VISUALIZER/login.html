<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — DSA Learn</title>
  <link rel="stylesheet" href="css/design-system.css">
</head>
<body>

  <main class="auth-page" role="main">
    <div class="auth-box">

      <!-- Icon -->
      <div class="auth-icon" aria-hidden="true">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none"
             stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
      </div>

      <h1 class="auth-title">Welcome Back</h1>
      <p class="auth-sub">Sign in to continue learning</p>

      <!-- Alert -->
      <div class="auth-alert" id="loginAlert" role="alert"></div>

      <form id="loginForm" novalidate autocomplete="off">

        <!-- Email -->
        <div class="field">
          <label for="email">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>
            </svg>
            Email Address
          </label>
          <input type="email" id="email" class="finput"
                 placeholder="you@example.com" autocomplete="email" required>
          <div class="ferr" id="email-err"></div>
        </div>

        <!-- Password -->
        <div class="field">
          <label for="password">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
            </svg>
            Password
          </label>
          <div class="pw-wrap">
            <input type="password" id="password" class="finput"
                   placeholder="••••••••" autocomplete="current-password" required>
            <button type="button" class="eye-btn" data-target="password"
                    aria-label="Toggle password visibility" tabindex="-1"></button>
          </div>
          <div class="ferr" id="pass-err"></div>
        </div>

        <button type="submit" class="btn btn-primary btn-full btn-lg" style="margin-top:6px">
          Sign In
        </button>

      </form>

      <div class="auth-div">or</div>

      <!-- Demo login -->
      <button id="demoBtn" class="btn btn-ghost btn-full" style="margin-bottom:4px">
        ⚡ Demo Login
      </button>
      <p style="text-align:center;font-size:.72rem;color:var(--text-3);margin-bottom:4px">
        Use demo mode instantly (no signup required)
      </p>

      <div class="auth-link-row">
        Don't have an account? <a href="signup.html">Create one free</a>
      </div>

    </div>
  </main>

  <script src="js/shell.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
