<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up — DSA Learn</title>
  <link rel="stylesheet" href="css/design-system.css">
</head>
<body>

  <main class="auth-page" style="padding-top:32px;padding-bottom:32px;" role="main">
    <div class="auth-box wide">

      <div class="auth-icon" aria-hidden="true">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none"
             stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
          <circle cx="9" cy="7" r="4"/>
          <line x1="19" y1="8" x2="19" y2="14"/>
          <line x1="22" y1="11" x2="16" y2="11"/>
        </svg>
      </div>

      <h1 class="auth-title">Create Account</h1>
      <p class="auth-sub">Join and start mastering DSA visually</p>

      <div class="auth-alert" id="signupAlert" role="alert"></div>

      <form id="signupForm" novalidate autocomplete="off">

        <!-- Full Name -->
        <div class="field">
          <label for="full_name">Full Name</label>
          <input type="text" id="full_name" class="finput" placeholder="Easha Akram" required>
          <div class="ferr"></div>
        </div>

        <!-- Email -->
        <div class="field">
          <label for="email">Email Address</label>
          <input type="email" id="email" class="finput" placeholder="you@example.com" required>
          <div class="ferr"></div>
        </div>

        <!-- Phone + CNIC -->
        <div class="frow">
          <div class="field">
            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" class="finput" placeholder="03001234567" maxlength="11" required>
            <div class="ferr"></div>
          </div>
          <div class="field">
            <label for="cnic">CNIC (13 digits)</label>
            <input type="text" id="cnic" class="finput" placeholder="3520112345671" maxlength="13" required>
            <div class="ferr"></div>
          </div>
        </div>

        <!-- DOB -->
        <div class="field">
          <label for="dob">Date of Birth</label>
          <input type="date" id="dob" class="finput" min="1950-01-01" max="2009-12-31" required>
          <div class="ferr"></div>
        </div>

        <!-- Password -->
        <div class="field">
          <label for="password">Password</label>
          <div class="pw-wrap">
            <input type="password" id="password" class="finput"
                   placeholder="Min 8 chars · uppercase · number · symbol" required>
            <button type="button" class="eye-btn" data-target="password"
                    aria-label="Toggle" tabindex="-1"></button>
          </div>
          <div class="str-bar"><div class="str-fill" id="str-fill"></div></div>
          <div class="str-lbl" id="str-lbl"></div>
          <div class="ferr"></div>
        </div>

        <!-- Confirm Password -->
        <div class="field">
          <label for="confirm_password">Confirm Password</label>
          <div class="pw-wrap">
            <input type="password" id="confirm_password" class="finput"
                   placeholder="Re-enter your password" required>
            <button type="button" class="eye-btn" data-target="confirm_password"
                    aria-label="Toggle" tabindex="-1"></button>
          </div>
          <div class="ferr"></div>
        </div>

        <button type="submit" class="btn btn-primary btn-full btn-lg" style="margin-top:8px">
          Create Account
        </button>

      </form>

      <div class="auth-link-row" style="margin-top:16px">
        Already have an account? <a href="login.html">Sign in</a>
      </div>

    </div>
  </main>

  <script src="js/shell.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
